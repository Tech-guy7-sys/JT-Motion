name: Build and publish JT Motion releases
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.1"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: jt-motion-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win, arch: x64, runner: windows-latest }
          - { platform: win, arch: ia32, runner: windows-latest }
          - { platform: win, arch: arm64, runner: windows-latest }
          - { platform: mac, arch: x64, runner: macos-15-intel }
          - { platform: mac, arch: arm64, runner: macos-14 }
          - { platform: linux, arch: x64, runner: ubuntu-latest }
          - { platform: linux, arch: arm64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - name: Validate source
        run: npm run check
      - name: Package desktop app
        shell: bash
        env:
          JT_PLATFORM: ${{ matrix.platform }}
          JT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$JT_PLATFORM" in
            win) npx electron-builder --win --${JT_ARCH} --config electron-builder.yml --publish never ;;
            mac) npx electron-builder --mac --${JT_ARCH} --config electron-builder.yml --publish never ;;
            linux) npx electron-builder --linux --${JT_ARCH} --config electron-builder.yml --publish never ;;
            *) exit 2 ;;
          esac
          test -d dist && test "$(find dist -maxdepth 1 -type f | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: jt-motion-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: jt-motion-*
          path: release-assets/packages
          merge-multiple: true
      - name: Select release tag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"
          elif [ -f release-trigger.txt ]; then TAG="$(tr -d '[:space:]' < release-trigger.txt)"
          else TAG="$REF_NAME"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Package source and checksums
        shell: bash
        env:
          VERSION_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/source
          zip -r "release-assets/source/JT Motion-${VERSION_TAG}-source.zip" . -x ".git/*" "node_modules/*" "dist/*" "release-assets/*"
          find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
      - name: Publish release with installers, source and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "JT Motion ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            release-assets/packages/*
            release-assets/source/*
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
