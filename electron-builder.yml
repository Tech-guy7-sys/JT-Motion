appId: com.jtdigitalworld.jtmotion
productName: JT Motion
directories:
  output: dist
files:
  - index.html
  - app.js
  - styles.css
  - desktop/**
  - package.json
asar: true
npmRebuild: false
publish: null
win:
  target:
    - target: nsis
      arch: [x64, ia32, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]